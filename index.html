<!DOCTYPE html>
<html lang="zh-CN">

    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>烤鱼</title>
        <meta content="width=device-width,initial-scale=1" name="viewport">
        <link rel="shortcut icon" href="./css/1f.png" type="image/x-icon">
        <link href="./css/font-awesome.min.css" rel="stylesheet">
        <link href="./css/JS_CSS/base.css" rel="stylesheet">
        <link href="./css/JS_CSS/glass.css" rel="stylesheet">
        <link href="./css/JS_CSS/nav.css" rel="stylesheet">
        <link href="./css/JS_CSS/button.css" rel="stylesheet">
        <link href="./css/JS_CSS/editor.css" rel="stylesheet">
        <link href="./css/JS_CSS/theme.css" rel="stylesheet">
        <!-- 尽早应用已保存的主题与主题色，避免深色用户看到一瞬白屏。
             这段必须留在 head 且不能 defer。 -->
        <script>
            try {
                var root = document.documentElement
                root.classList.add("nv-js")
                if (localStorage.getItem("nav_theme_v1") === "dark") {
                    root.classList.add("dark")
                }
            } catch (e) {
            }
        </script>
    </head>

    <body>
        <!-- 流动的极光底色场：所有玻璃面板的折射对象 -->
        <div class="liquid-bg" aria-hidden="true">
            <span class="blob blob-1"></span>
            <span class="blob blob-2"></span>
            <span class="blob blob-3"></span>
            <span class="blob blob-4"></span>
            <span class="grain"></span>
        </div>

        <div id="site-main">
            <header id="site-header">
                <div class="container">
                    <div class="topbar glass glass-sheen">
                        <div class="logo" title="烤鱼">
                            <span class="logo-orb"></span>
                            <span class="logo-text">烤鱼</span>
                        </div>
                        <div class="topbar-actions">
                            <button type="button" class="icon-btn" id="nav-theme" title="夜间模式" aria-label="切换夜间模式">
                                <i class="fa fa-moon-o"></i>
                            </button>
                            <button type="button" class="icon-btn" id="nav-gear" title="设置" aria-label="进入编辑模式">
                                <i class="fa fa-cog"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <section class="hero">
                <div class="container">
                    <h1 class="hero-title">所有常用，<span class="grad">一处直达</span></h1>
                    <p class="hero-sub">搜索，或从下面的收藏里挑一个</p>
                    <form class="search-form glass" target="_blank" action="https://cn.bing.com/search">
                        <i class="fa fa-search search-icon" aria-hidden="true"></i>
                        <input class="search-keyword" type="search" autocomplete="off" autofocus name="q" placeholder="必应 搜索">
                        <button type="submit" class="search-go">搜索</button>
                    </form>
                    <div class="search-tab glass" role="tablist" aria-label="搜索引擎">
                        <span class="seg-thumb" aria-hidden="true"></span>
                        <span class="bing" role="tab">必应</span>
                        <span class="baidu" role="tab">百度</span>
                        <span class="google" role="tab">谷歌</span>
                        <span class="lookao" role="tab">维基百科</span>
                        <span class="scholar" role="tab">学术</span>
                        <span class="image" role="tab">图片</span>
                        <span class="torrent" role="tab">shodan</span>
                    </div>
                </div>
            </section>

            <main class="works">
                <div class="container">
                    <div class="work-link">
                        <div class="info">
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <div id="nav-toolbar">
            <button type="button" class="nv-btn nv-btn-primary" id="nv-add-url" title="新增网址"><i class="fa fa-plus"></i><span>新增网址</span></button>
            <button type="button" class="nv-btn" id="nv-add-cat" title="新增分类"><i class="fa fa-folder-o"></i><span>新增分类</span></button>
            <span class="nv-sep"></span>
            <button type="button" class="nv-btn" id="nv-export" title="导出"><i class="fa fa-download"></i><span>导出</span></button>
            <button type="button" class="nv-btn" id="nv-import" title="导入"><i class="fa fa-upload"></i><span>导入</span></button>
            <span class="nv-sep"></span>
            <button type="button" class="nv-btn nv-btn-danger" id="nv-reset" title="恢复默认设置"><i class="fa fa-undo"></i><span>恢复默认设置</span></button>
            <input type="file" id="nv-import-file" accept=".json,application/json" hidden>
        </div>

        <div id="nv-modal" class="nv-modal" aria-hidden="true">
            <div class="nv-modal-mask" data-nv-close></div>
            <div class="nv-modal-panel" role="dialog" aria-modal="true" aria-labelledby="nv-modal-title">
                <header class="nv-modal-head">
                    <h3 id="nv-modal-title">新增网址</h3>
                    <span class="nv-close" data-nv-close>&times;</span>
                </header>

                <div class="nv-modal-body" id="nv-form-link">
                    <label class="nv-field">
                        <span class="nv-label">名称</span>
                        <input type="text" id="nv-name" placeholder="例如：GitHub" autocomplete="off">
                    </label>
                    <label class="nv-field">
                        <span class="nv-label">网址</span>
                        <input type="text" id="nv-url" placeholder="例如：https://github.com" autocomplete="off">
                    </label>
                    <label class="nv-field">
                        <span class="nv-label">分类</span>
                        <select id="nv-category"></select>
                    </label>
                </div>

                <div class="nv-modal-body" id="nv-form-cat" hidden>
                    <label class="nv-field">
                        <span class="nv-label">分类名称</span>
                        <input type="text" id="nv-cat-name" placeholder="例如：常用工具" autocomplete="off">
                    </label>
                </div>

                <footer class="nv-modal-foot">
                    <button type="button" class="nv-btn nv-btn-ghost" data-nv-close>取消</button>
                    <button type="button" class="nv-btn nv-btn-primary" id="nv-save">保存</button>
                </footer>
            </div>
        </div>

        <div id="nv-toast"></div>

        <script defer src="./css/JS_CSS/store.js"></script>
        <script defer src="./css/JS_CSS/app.js"></script>
    </body>

</html>
